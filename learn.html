<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IT上場企業 1000本ノック</title>
<style>
:root{
  --gray-l:#D0D0CE; --black:#080808; --gray-m:#696965; --red:#FF0000; --olive:#78600C; --white:#FFFFFF;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:"BIZ UDPGothic","BIZ UDPゴシック",sans-serif; font-size:12px; line-height:1.6; color:var(--black); background:var(--white); padding:16px; max-width:1080px; margin:0 auto; overflow-wrap:anywhere;}
@media(min-width:720px){body{padding:24px;}}
h1{font-size:20px; font-weight:700; margin-bottom:4px;}
a{color:var(--olive);}
button,input,select,textarea{font-family:inherit; font-size:12px; color:var(--black);}
:focus-visible{outline:2px solid var(--olive); outline-offset:1px;}
.sub{color:var(--gray-m); margin-bottom:10px;}
.top{display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin-bottom:10px;}
.btn{padding:6px 12px; border:1px solid var(--gray-l); border-radius:4px; background:var(--white); cursor:pointer;}
.btn:hover{border-color:var(--olive); color:var(--olive);}
.btn:disabled{color:var(--gray-l); border-color:var(--gray-l); cursor:default;}
.btn.sm{padding:2px 8px; font-size:11px; color:var(--gray-m);}
.btn.pri{border-color:var(--black); background:var(--black); color:var(--white);}
.btn.pri:hover{border-color:var(--olive); background:var(--olive); color:var(--white);}
.btn.done{border-color:var(--olive); color:var(--olive);}
.tabs{display:flex; gap:0; border-bottom:1px solid var(--black); margin-bottom:12px;}
.tab{padding:8px 16px; border:1px solid var(--gray-l); border-bottom:none; background:var(--white); cursor:pointer; border-radius:4px 4px 0 0; margin-right:-1px;}
.tab.on{background:var(--black); color:var(--white); border-color:var(--black);}
.io{border:1px solid var(--gray-l); border-radius:4px; padding:10px 12px; margin-bottom:10px;}
.io textarea{width:100%; height:80px; border:1px solid var(--gray-l); border-radius:4px; padding:6px; margin:6px 0;}
.io .row2{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.msg{color:var(--olive); margin-top:4px;}
.err{color:var(--red);}
input[type=search],input[type=text],input[type=number],select{padding:7px 8px; border:1px solid var(--gray-l); border-radius:4px; background:var(--white); outline:none; max-width:100%;}
input[type=search]:focus,input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--gray-m);}
.qrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
.qrow input[type=search]{flex:1 1 220px; min-width:0;}
details.flt{border:1px solid var(--gray-l); border-radius:4px; padding:8px 12px; margin-bottom:8px;}
details.flt>summary{cursor:pointer; font-weight:700;}
.fgroup{margin-top:10px;}
.fgroup>.fl{font-weight:700; color:var(--gray-m); margin-bottom:2px;}
.chks{display:flex; flex-wrap:wrap; gap:2px 12px;}
.chks label{display:flex; align-items:center; gap:4px; white-space:nowrap; cursor:pointer;}
.rng{display:flex; flex-wrap:wrap; gap:6px 16px;}
.rng .rg{display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
.rng input{width:92px;}
.meta{color:var(--gray-m); margin:8px 0;}
.meta b{color:var(--black);}
.hdr,.row{display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; padding:6px 8px;}
.row{border:1px solid var(--gray-l); border-radius:4px; margin-bottom:4px; cursor:pointer; background:var(--white);}
.row:hover{border-color:var(--gray-m);}
.row.isread .c-name{opacity:.55;}
.hdr{display:none; color:var(--gray-m); font-weight:700; border-bottom:1px solid var(--black);}
.c-chk{width:28px; flex:none; white-space:nowrap;}
.c-name{flex:1 1 140px; min-width:0; text-align:left; border:none; background:none; cursor:pointer; font-weight:700; padding:2px 0;}
.c-name:hover{color:var(--olive);}
.c-hj{border:none; background:none; cursor:pointer; color:var(--gray-m); text-align:left; padding:2px 0;}
.c-hj:hover{color:var(--olive);}
.c-n{text-align:right; white-space:nowrap;}
.c-n::before{content:attr(data-l) " "; color:var(--gray-m); font-size:11px;}
.neg{color:var(--red);}
.badge{display:inline-block; font-size:11px; border:1px solid var(--olive); color:var(--olive); border-radius:10px; padding:0 8px; margin-right:3px; white-space:nowrap;}
.badge.sub2{border-color:var(--gray-m); color:var(--gray-m);}
.badge.non{border-color:var(--black); color:var(--black);}
.badge.gry{border-color:var(--gray-l); color:var(--gray-m);}
.c-st{white-space:nowrap; color:var(--gray-m);}
.c-st.ok{color:var(--olive);}
.grp{background:var(--black); color:var(--white); padding:6px 10px; border-radius:4px; margin:12px 0 4px; font-weight:700;}
.empty{color:var(--gray-m); padding:24px; text-align:center;}
@media(min-width:900px){
  .hdr{display:flex; flex-wrap:nowrap;}
  .row{flex-wrap:nowrap;}
  .c-name{flex:1 1 150px;}
  .c-hj{width:124px; flex:none; white-space:nowrap;}
  .c-mk{width:64px; flex:none;}
  .c-ty{width:160px; flex:none; overflow:hidden;}
  .c-n{width:70px; flex:none;}
  .c-n::before{content:none;}

  .hdr .c-n,.hdr .c-nb,.hdr .c-st{text-align:right;}
  .hdr span{white-space:nowrap;}
}
.card{border:1px solid var(--gray-l); border-radius:4px; padding:12px 14px;}
.ctitle{font-size:20px; font-weight:700; line-height:1.4;}
.csub{color:var(--gray-m); margin:2px 0 6px;}
.links{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin:6px 0;}
.oneliner{margin:10px 0; padding:8px 10px; border-left:3px solid var(--olive); font-weight:700;}
.fin4{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin:8px 0 2px;}
@media(min-width:720px){.fin4{grid-template-columns:repeat(4,minmax(0,1fr));}}
.fcell{border:1px solid var(--gray-l); border-radius:4px; padding:6px 8px;}

.fcell .fv{font-size:14px; font-weight:700;}
.fcell .fs{color:var(--gray-m); font-size:11px;}
.fnote{color:var(--gray-m); font-size:11px; margin-bottom:8px;}
.biz{border:1px solid var(--gray-l); border-radius:4px; padding:10px 12px; margin-top:10px;}
.bizhead{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline;}
.bizhead .bn{font-size:12px; font-weight:700;}
.ent{color:var(--gray-m);}
.tags{margin:4px 0;}
.tag{display:inline-block; font-size:11px; border:1px solid var(--gray-l); border-radius:10px; padding:0 8px; margin:0 3px 2px 0; color:var(--gray-m);}
.tag.cu{border-color:var(--olive); color:var(--olive);}
.tag.vt{border-color:var(--black); color:var(--black);}
.share{display:flex; align-items:center; gap:8px; margin:6px 0;}
.share .bar{flex:1 1 auto; height:8px; border:1px solid var(--gray-m); border-radius:4px; overflow:hidden; min-width:60px;}
.share .bar i{display:block; height:100%; background:var(--olive);}
.share .st{white-space:nowrap; color:var(--gray-m); font-size:11px;}
.w3{display:grid; grid-template-columns:minmax(0,1fr); gap:8px; margin:8px 0;}
@media(min-width:720px){.w3{grid-template-columns:repeat(3,minmax(0,1fr));}}
.w3>div{border:1px solid var(--gray-l); border-radius:4px; padding:6px 8px;}
.w3 .k{font-weight:700; color:var(--olive); margin-bottom:2px;}
.flowhost{margin:8px 0 4px; width:100%;}
.flowhost svg{display:block; max-width:100%; height:auto;}
.flowlegend{margin:4px 0 0 0; padding:0; list-style:none; font-size:11px; color:var(--gray-m);}
.flowlegend li{margin-bottom:2px;}
.flowlegend .ln{display:inline-block; width:28px; height:0; vertical-align:middle; margin-right:6px;}
.flowlegend .ln.m{border-top:2px solid var(--olive);}
.flowlegend .ln.v{border-top:2px dashed var(--gray-m);}
.flowlegend .nb{display:inline-block; min-width:16px; text-align:center; border:1px solid var(--gray-m); border-radius:8px; color:var(--black); margin-right:4px;}
.flowlegend .kd{color:var(--olive); font-weight:700;}
.flowlegend .kd.v{color:var(--gray-m);}
.src{color:var(--gray-m); font-size:11px; margin-top:4px;}
.sec{margin-top:14px;}
.sec>h2{font-size:12px; font-weight:700; border-bottom:1px solid var(--black); padding-bottom:2px; margin-bottom:6px;}
details.gl{margin-top:12px; border:1px solid var(--gray-l); border-radius:4px; padding:6px 10px;}
details.gl>summary{cursor:pointer; font-weight:700;}
details.gl dl{margin-top:6px;}
details.gl dt{font-weight:700; display:inline;}
details.gl dd{display:inline;}
details.gl .gi{margin-bottom:4px;}
.manee p{margin-bottom:4px;}
.manee .mut{color:var(--gray-m);}
.readbig{display:block; width:100%; padding:12px; margin:12px 0 6px; border:2px solid var(--black); border-radius:4px; background:var(--white); cursor:pointer; font-weight:700;}
.readbig.on{border-color:var(--olive); color:var(--olive);}
.memo{width:100%; min-height:64px; padding:6px 8px; border:1px solid var(--gray-l); border-radius:4px; resize:vertical;}
.memolbl{color:var(--gray-m); font-size:11px; margin-top:6px;}
.nav{display:flex; justify-content:space-between; gap:8px; margin-top:12px;}
.quizbar{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-bottom:10px;}
.prog{font-weight:700;}
.hint{color:var(--gray-m); font-size:11px; margin-bottom:8px;}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
.acts .btn{padding:10px 16px;}
.cover{border:1px dashed var(--gray-m); border-radius:4px; padding:16px; text-align:center; color:var(--gray-m); margin:10px 0;}
.cover.go{cursor:pointer;}
.qnav{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 8px;}
.qnav .btn{padding:8px 16px;}
.note{font-size:11px; color:var(--gray-m);}
.tip{border-left:3px solid var(--olive); background:var(--white); padding:6px 10px; margin:0 0 10px; border-top:1px solid var(--gray-l); border-right:1px solid var(--gray-l); border-bottom:1px solid var(--gray-l);}
.tiplabel{display:inline-block; font-size:11px; color:var(--white); background:var(--olive); border-radius:3px; padding:0 6px; margin-right:8px;}
.tipsrc{font-size:11px; color:var(--gray-m); margin-top:2px;}
.seg{display:inline-flex; margin:0 0 8px;}
.seg .btn{border-radius:0; margin-right:-1px;}
.seg .btn:first-child{border-radius:4px 0 0 4px;}
.seg .btn:last-child{border-radius:0 4px 4px 0;}
.seg .btn.on{background:var(--black); color:var(--white); border-color:var(--black);}
.cover.go:hover{border-color:var(--olive); color:var(--olive);}
.fl-box{fill:var(--white); stroke:var(--black); stroke-width:1.5;}
.fl-t{fill:var(--black); font-size:12px; font-family:"BIZ UDPGothic","BIZ UDPゴシック",sans-serif;}
.fl-l{fill:var(--black); font-size:11px; font-family:"BIZ UDPGothic","BIZ UDPゴシック",sans-serif; paint-order:stroke; stroke:var(--white); stroke-width:4px; stroke-linejoin:round;}
.fl-money{fill:none; stroke:var(--olive); stroke-width:2;}
.fl-value{fill:none; stroke:var(--gray-m); stroke-width:1.5; stroke-dasharray:5 4;}
.mk-money{fill:var(--olive);}
.mk-value{fill:var(--gray-m);}
.fl-bd-money{fill:var(--white); stroke:var(--olive); stroke-width:1.5;}
.fl-bd-value{fill:var(--white); stroke:var(--gray-m); stroke-width:1.5;}
.fl-n{fill:var(--black); font-size:10px; text-anchor:middle; font-family:"BIZ UDPGothic","BIZ UDPゴシック",sans-serif;}
</style>
</head>
<body>
<h1>IT上場企業 1000本ノック</h1>
<p class="sub" id="sub">読み込み中…</p>
<div class="top">
  <a href="index.html">IRライブラリへ</a>
  <button class="btn sm" id="btnExport" type="button">書き出し</button>
  <button class="btn sm" id="btnImport" type="button">読み込み</button>
  <span class="note">既読・メモはこの端末のブラウザにだけ保存されます（他の人の画面には出ません。別の端末へ移すときは書き出し→読み込み）</span>
  <span class="msg" id="topMsg"></span>
</div>
<div class="io" id="ioPanel" hidden>
  <div class="row2">
    <span>進捗ファイル（JSON）を選ぶ：</span>
    <input type="file" id="ioFile" accept=".json,application/json">
  </div>
  <div>または貼り付け：</div>
  <textarea id="ioText" placeholder="書き出したJSONをここに貼り付け"></textarea>
  <div class="row2">
    <button class="btn" id="ioGo" type="button">取り込む（既存と統合）</button>
    <button class="btn" id="ioClose" type="button">閉じる</button>
    <span id="ioMsg"></span>
  </div>
</div>
<div class="tabs" role="tablist">
  <button class="tab" type="button" data-tab="list">一覧</button>
  <button class="tab" type="button" data-tab="quiz">暗記カード</button>
</div>
<div id="v-list">
  <div class="qrow">
    <input type="search" id="q" placeholder="社名・証券コード・法人番号・事業名・用語">
    <select id="sort" aria-label="並べ替え"></select>
    <button class="btn" id="dir" type="button"></button>
    <label style="display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer"><input type="checkbox" id="grp">区分でまとめる</label>
  </div>
  <details class="flt" id="flt"><summary>絞り込み</summary><div id="filters"></div></details>
  <div class="meta" id="meta"></div>
  <div class="hdr" id="hdr">
    <span class="c-chk">読了</span><span class="c-name" style="cursor:default">社名（クリックでコピー）</span><span class="c-hj">法人番号</span><span class="c-mk">市場</span><span class="c-ty">区分</span>
    <span class="c-n">売上(百万円)</span><span class="c-n">営業利益</span><span class="c-n">利益率</span><span class="c-n">時価総額(億)</span><span class="c-nb">事業</span><span class="c-st">本文</span>
  </div>
  <div id="list"></div>
</div>
<div id="v-quiz" hidden></div>

<script>
'use strict';
/* ===== 定数 ===== */
const TYPE_NAMES={IT01:'受託開発',IT02:'SES・技術者派遣',IT03:'ITコンサル・DX支援',IT04:'AI・データ受託',IT05:'SaaS・自社プロダクト',IT06:'組込み・検証',IT07:'インフラ・運用保守・セキュリティ',IT08:'Web制作・デジタルマーケ支援',IT09:'プラットフォーム・メディア',IT10:'ゲーム・コンテンツ',IT11:'BPO・情報処理サービス'};
const TYPE_KEYS=Object.keys(TYPE_NAMES).concat(['非IT','未分類']);
const CUSTOMERS=['大企業','中小企業','個人','官公庁・公共'];
const PRICINGS=['月額','従量','人月・稼働','成果報酬・手数料','売り切り・請負','広告'];
const MARKETS=['プライム','スタンダード','グロース'];
const SORTS=[['mcap','時価総額'],['sales','売上'],['op','営業利益'],['opm','営業利益率'],['code','証券コード'],['name','社名']];
const LS_KEY='learn:v1';

/* ===== 小道具 ===== */
function add(e,c){
  if(c==null||c===false) return;
  if(Array.isArray(c)){ c.forEach(function(x){add(e,x);}); }
  else if(c instanceof Node){ e.appendChild(c); }
  else { e.appendChild(document.createTextNode(String(c))); }
}
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs){ for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='cls') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v); } }
  for(let i=2;i<arguments.length;i++) add(e,arguments[i]);
  return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs){
  const e=document.createElementNS(SVGNS,tag);
  if(attrs){ for(const k in attrs){ if(attrs[k]==null) continue; if(k==='text') e.textContent=attrs[k]; else if(k==='cls') e.setAttribute('class',attrs[k]); else e.setAttribute(k,attrs[k]); } }
  for(let i=2;i<arguments.length;i++) add(e,arguments[i]);
  return e;
}
function $(id){return document.getElementById(id);}
function norm(s){return String(s==null?'':s).normalize('NFKC').toLowerCase();}
function fmtM(v){return v==null?'－':Math.round(v/1e6).toLocaleString('en-US');}
function fmtOku(v){return v==null?'－':Math.round(v/1e8).toLocaleString('en-US');}
function fmtPct(v){return v==null?'－':v.toFixed(1)+'%';}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function safeUrl(u){return typeof u==='string'&&/^https?:\/\//i.test(u)?u:null;}
function typeKey(t){ if(!t) return '未分類'; if(/^IT\d\d$/.test(t)) return t; if(t.indexOf('非IT')===0) return '非IT'; return '未分類'; }
function typeLabel(t){ if(!t) return ''; return TYPE_NAMES[t]?t+' '+TYPE_NAMES[t]:t; }
function typeKeyLabel(k){ return TYPE_NAMES[k]?k+' '+TYPE_NAMES[k]:k; }

/* ===== 保存（localStorage） ===== */
let store={read:{},memo:{},settings:{}};
function loadStore(){
  try{
    const t=localStorage.getItem(LS_KEY);
    if(t){ const o=JSON.parse(t);
      store.read=(o&&typeof o.read==='object'&&o.read)||{};
      store.memo=(o&&typeof o.memo==='object'&&o.memo)||{};
      store.settings=(o&&typeof o.settings==='object'&&o.settings)||{}; }
  }catch(e){}
}
function saveStore(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(store)); }catch(e){} }

/* ===== データ ===== */
let COMPANIES=[],ROWS=[],BY={},DOCS=new Map(),META={updated:''},FIN={},FINA={},PROF={};
function fetchJson(path,optional){
  return fetch(path,{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(path+' '+r.status); return r.json(); })
    .catch(function(e){ if(optional) return null; throw e; });
}
function buildRows(){
  ROWS=[]; BY={};
  COMPANIES.forEach(function(co){
    const code=co.code, f=FIN[code], fi=FINA[code], p=PROF[code]||null;
    const c={code:code,co:co,name:co.name||'',display:co.display||co.name||'',houjin:co.houjin||'',market:co.market||'',edinet:co.edinet||'',p:p,
      sales:null,op:null,opm:null,mcap:null,salesSrc:'',opSrc:'',fyEnd:'',scope:'',standard:'',edinetUrl:''};
    if(f&&f.sales!=null){ c.sales=f.sales; c.salesSrc='有報'; if(f.op!=null){c.op=f.op;c.opSrc='有報';}
      c.fyEnd=f.fy_end||''; c.scope=f.scope||''; c.standard=f.standard||''; c.edinetUrl=safeUrl(f.url)||''; }
    else if(fi&&typeof fi==='object'&&fi.rev>0){ c.sales=fi.rev; c.salesSrc='yfinance'; c.fyEnd=fi.fy||''; }
    if(fi&&typeof fi==='object'&&fi.mcap>0) c.mcap=fi.mcap;
    if(c.sales&&c.op!=null) c.opm=c.op/c.sales*100;
    if(!c.fyEnd&&p&&p.fy_end) c.fyEnd=p.fy_end;
    const bs=(p&&Array.isArray(p.businesses))?p.businesses:[];
    c.biz=bs;
    c.mainKey=(p&&p.main_type)?typeKey(p.main_type):'未分類';
    const any=new Set();
    if(p&&p.main_type) any.add(typeKey(p.main_type));
    if(p&&p.sub_type) any.add(typeKey(p.sub_type));
    bs.forEach(function(b){ if(b&&b.type) any.add(typeKey(b.type)); });
    if(!any.size) any.add('未分類');
    c.anyKeys=any;
    c.cust=new Set(); c.pric=new Set(); const vts=[];
    bs.forEach(function(b){ (b.customer||[]).forEach(function(x){c.cust.add(x);}); (b.pricing||[]).forEach(function(x){c.pric.add(x);}); if(b.vertical) vts.push(b.vertical); });
    c.vert=norm(vts.join(' '));
    c.bodyDone=!!(p&&p.status&&p.status.body==='done');
    const hay=[code,c.name,c.display,c.houjin,c.edinet];
    bs.forEach(function(b){ hay.push(b.name||''); });
    ((p&&p.glossary)||[]).forEach(function(g){ hay.push(g.term||''); });
    c.hay=norm(hay.join(' '));
    ROWS.push(c); BY[code]=c;
  });
}
function buildDocs(arr){
  DOCS=new Map();
  (arr||[]).forEach(function(d){ if(!d||!d.code) return; if(!DOCS.has(d.code)) DOCS.set(d.code,[]); DOCS.get(d.code).push(d); });

let S;
let WANT_REVEAL=false;  // 次に暗記カードを描くとき、その社を全部表示で開く
function defState(){
  return {tab:'list',q:'',ty:new Set(TYPE_KEYS.filter(function(k){return k!=='非IT';})),tm:'main',cu:new Set(),pr:new Set(),vt:'',mk:new Set(),bd:'',rd:'',
    sl:'',sh:'',ol:'',oh:'',ml:'',mh:'',cl:'',ch:'',sort:'mcap',dir:'desc',grp:false,c:'',qm:'fwd'};
}
const SCALARS=['tab','q','tm','vt','bd','rd','sl','sh','ol','oh','ml','mh','cl','ch','sort','dir','c','qm'];
function toHash(){
  const d=defState(), p=new URLSearchParams();
  SCALARS.forEach(function(k){ if(S[k]!==d[k]) p.set(k,S[k]); });
  ['cu','pr','mk'].forEach(function(k){ if(S[k].size) p.set(k,Array.from(S[k]).join(',')); });
  let same=S.ty.size===d.ty.size; if(same) S.ty.forEach(function(x){ if(!d.ty.has(x)) same=false; });
  if(!same) p.set('ty',Array.from(S.ty).join(','));
  if(S.grp) p.set('grp','1');
  return p.toString();
}
function fromHash(str){
  const d=defState(), p=new URLSearchParams(str.replace(/^#/,''));
  SCALARS.forEach(function(k){ if(p.has(k)) d[k]=p.get(k); });
  ['cu','pr','mk'].forEach(function(k){ if(p.has(k)) d[k]=new Set(p.get(k).split(',').filter(Boolean)); });
  if(p.has('ty')) d.ty=new Set(p.get('ty').split(',').filter(Boolean));
  d.grp=p.get('grp')==='1';
  if(d.tab==='list'&&p.has('c')&&!p.has('tab')) d.tab='card';
  if(d.tab==='card'){ d.tab='quiz'; d.qm='fwd'; WANT_REVEAL=true; }  // 旧「1社カード」のURLは暗記カードの全部表示で開く
  if(['list','quiz'].indexOf(d.tab)<0) d.tab='list';
  if(['fwd','rev'].indexOf(d.qm)<0) d.qm='fwd';
  if(['asc','desc'].indexOf(d.dir)<0) d.dir='desc';
  if(!SORTS.some(function(s){return s[0]===d.sort;})) d.sort='mcap';
  if(d.tm!=='any') d.tm='main';
  return d;
}
function pushHash(push){
  const hs='#'+toHash();
  try{ store.settings.hash=toHash(); saveStore(); }catch(e){}
  if(location.hash===hs||(hs==='#'&&!location.hash)) return;
  try{ if(push) history.pushState(null,'',hs==='#'?location.pathname+location.search:hs); else history.replaceState(null,'',hs==='#'?location.pathname+location.search:hs); }catch(e){}
}

/* ===== 絞り込みと並べ替え ===== */
let VIEW=[];
function inRange(v,lo,hi,unit){
  const l=lo===''?null:parseFloat(lo), u=hi===''?null:parseFloat(hi);
  if((l==null||isNaN(l))&&(u==null||isNaN(u))) return true;
  if(v==null) return false;
  const x=v/unit;
  if(l!=null&&!isNaN(l)&&x<l) return false;
  if(u!=null&&!isNaN(u)&&x>u) return false;
  return true;
}
function computeList(){
  const words=norm(S.q).split(/\s+/).filter(Boolean), vt=norm(S.vt);
  let arr=ROWS.filter(function(c){
    for(let i=0;i<words.length;i++) if(c.hay.indexOf(words[i])<0) return false;
    if(S.tm==='main'){ if(!S.ty.has(c.mainKey)) return false; }
    else { let ok=false; c.anyKeys.forEach(function(k){ if(S.ty.has(k)) ok=true; }); if(!ok) return false; }
    if(S.cu.size){ let ok=false; S.cu.forEach(function(x){ if(c.cust.has(x)) ok=true; }); if(!ok) return false; }
    if(S.pr.size){ let ok=false; S.pr.forEach(function(x){ if(c.pric.has(x)) ok=true; }); if(!ok) return false; }
    if(vt&&c.vert.indexOf(vt)<0) return false;
    if(S.mk.size&&!S.mk.has(c.market)) return false;
    if(S.bd==='done'&&!c.bodyDone) return false;
    if(S.bd==='pending'&&c.bodyDone) return false;
    if(S.rd==='unread'&&store.read[c.code]) return false;
    if(!inRange(c.sales,S.sl,S.sh,1e6)) return false;
    if(!inRange(c.op,S.ol,S.oh,1e6)) return false;
    if(!inRange(c.opm,S.ml,S.mh,1)) return false;
    if(!inRange(c.mcap,S.cl,S.ch,1e8)) return false;
    return true;
  });
  const dir=S.dir==='asc'?1:-1, k=S.sort;
  arr.sort(function(a,b){
    if(k==='code'||k==='name'){
      const x=k==='code'?a.code:a.display, y=k==='code'?b.code:b.display;
      const r=k==='code'?(x<y?-1:x>y?1:0):x.localeCompare(y,'ja');
      return r*dir;
    }
    const x=a[k], y=b[k];
    if(x==null&&y==null) return a.code<b.code?-1:1;
    if(x==null) return 1;
    if(y==null) return -1;
    return x===y?(a.code<b.code?-1:1):(x-y)*dir;
  });
  return arr.map(function(c){return c.code;});
}

function copyText(el,text){
  function ok(){ const o=el.getAttribute('data-orig')||el.textContent; el.setAttribute('data-orig',o); el.textContent='コピー済'; el.classList.add('done');
    clearTimeout(el._t); el._t=setTimeout(function(){ el.textContent=o; el.classList.remove('done'); el.removeAttribute('data-orig'); },1000); }
  function fb(){ try{ const t=h('textarea',{style:'position:fixed;left:-9999px'}); t.value=text; document.body.appendChild(t); t.select(); const r=document.execCommand('copy'); t.remove(); if(r) ok(); }catch(e){} }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,fb); } else fb(); }catch(e){ fb(); }
}

/* ===== お金の流れ図 ===== */
let flowHosts=[], markerSeq=0;
function wrapText(str,units){
  const out=[]; let cur='', w=0;
  Array.from(String(str)).forEach(function(ch){
    const cw=ch.charCodeAt(0)<256?0.55:1;
    if(w+cw>units&&cur){ out.push(cur); cur=''; w=0; }
    cur+=ch; w+=cw;
  });
  if(cur) out.push(cur);
  return out.length?out:[''];
}
function textLines(parent,lines,x,y0,lh,cls,anchor){
  const t=sv('text',{x:x,y:y0,cls:cls,'text-anchor':anchor||'start'});
  lines.forEach(function(ln,i){ t.appendChild(sv('tspan',{x:x,y:y0+i*lh,text:ln})); });
  parent.appendChild(t); return t;
}
function drawFlow(host,mf,mask){
  host.replaceChildren();
  const players=(mf&&Array.isArray(mf.players))?mf.players:[];
  if(!players.length) return;
  const avail=Math.max(260,Math.floor(host.clientWidth||300));
  const P=players.map(function(p){return {id:p.id,label:mask(p.label||String(p.id))};});
  const idx=new Map(); P.forEach(function(p,i){idx.set(p.id,i);});
  const FL=(Array.isArray(mf.flows)?mf.flows:[]).filter(function(f){return idx.has(f.from)&&idx.has(f.to)&&f.from!==f.to;}).map(function(f){
    return {a:idx.get(f.from),b:idx.get(f.to),kind:f.kind==='money'?'money':'value',text:mask(f.what||'')+(f.when?'（'+mask(f.when)+'）':'')};
  });

  const defs=sv('defs',null);
  ['money','value'].forEach(function(k){
    defs.appendChild(sv('marker',{id:'mk'+k+uid,viewBox:'0 0 8 8',refX:'8',refY:'4',markerWidth:'8',markerHeight:'8',markerUnits:'userSpaceOnUse',orient:'auto'},
      sv('path',{d:'M0,0 L8,4 L0,8 z',cls:'mk-'+k})));
  });
  // 各箱に触れる矢印を数え、端点をずらす
  const touch=P.map(function(){return [];});
  FL.forEach(function(f,i){ touch[f.a].push(i); touch[f.b].push(i); });
  function slot(box,i){ const L=touch[box], m=L.length, k=L.indexOf(i); return (k-(m-1)/2); }
  let svg, legend=null;
  if(horizontal){
    const W=Math.min(170,Math.floor((avail-(n-1)*48)/n));
    const gap=n>1?(avail-n*W)/(n-1):0, x0=n>1?0:(avail-W)/2;
    P.forEach(function(p){ p.lines=wrapText(p.label,Math.floor((W-12)/12)).slice(0,3); });
    const BH=Math.max.apply(null,P.map(function(p){return p.lines.length;}))*15+14;
    svg=sv('svg',null,defs);
    P.forEach(function(p,i){
      const x=x0+i*(W+gap); p.cx=x+W/2;
      svg.appendChild(sv('rect',{x:x,y:1,width:W,height:BH,rx:4,cls:'fl-box'}));
      textLines(svg,p.lines,p.cx,1+(BH-p.lines.length*15)/2+11,15,'fl-t','middle');
    });
    let y=BH+12;

    FL.forEach(function(f,i){
      const xf=P[f.a].cx+slot(f.a,i)*Math.min(16,(W-20)/Math.max(1,touch[f.a].length));
      const xt=P[f.b].cx+slot(f.b,i)*Math.min(16,(W-20)/Math.max(1,touch[f.b].length));
      const lines=wrapText(f.text,labelUnits);
      const laneY=y+lines.length*14+4;
      let lw=0; lines.forEach(function(l){ let u=0; Array.from(l).forEach(function(ch){u+=ch.charCodeAt(0)<256?0.55:1;}); lw=Math.max(lw,u*11); });
      const mid=Math.min(Math.max((xf+xt)/2,lw/2+4),avail-lw/2-4);
      svg.appendChild(sv('path',{d:'M'+xf+','+(BH+1)+' L'+xf+','+laneY+' L'+xt+','+laneY+' L'+xt+','+(BH+2),cls:'fl-'+f.kind,'marker-end':'url(#mk'+f.kind+uid+')'}));
      textLines(svg,lines,mid,y+11,14,'fl-l','middle');
      y=laneY+12;
    });
    svg.setAttribute('width',avail); svg.setAttribute('height',Math.ceil(y)); svg.setAttribute('viewBox','0 0 '+avail+' '+Math.ceil(y));
    legend=h('ul',{cls:'flowlegend'},h('li',null,h('span',{cls:'ln m'}),'お金の流れ（実線）　',h('span',{cls:'ln v'}),'モノ・サービスの流れ（破線）'));
  } else {
    const BW=Math.max(110,Math.min(190,Math.floor(avail*0.5)));
    P.forEach(function(p){ p.lines=wrapText(p.label,Math.floor((BW-12)/12)).slice(0,4); p.h=p.lines.length*15+14; });
    let y=1; P.forEach(function(p){ p.y=y; y+=p.h+30; });
    const total=y-30+2;
    const k=Math.max(1,FL.length), sp=Math.min(18,Math.max(10,(avail-BW-30)/k));
    svg=sv('svg',null,defs);
    P.forEach(function(p){
      svg.appendChild(sv('rect',{x:1,y:p.y,width:BW,height:p.h,rx:4,cls:'fl-box'}));
      textLines(svg,p.lines,1+BW/2,p.y+(p.h-p.lines.length*15)/2+11,15,'fl-t','middle');
    });
    legend=h('ul',{cls:'flowlegend'});
    FL.forEach(function(f,i){
      const ya=P[f.a].y+P[f.a].h*(slot(f.a,i)+(touch[f.a].length-1)/2+1)/(touch[f.a].length+1);
      const yb=P[f.b].y+P[f.b].h*(slot(f.b,i)+(touch[f.b].length-1)/2+1)/(touch[f.b].length+1);
      const xl=BW+14+i*sp;
      svg.appendChild(sv('path',{d:'M'+(BW+1)+','+ya+' L'+xl+','+ya+' L'+xl+','+yb+' L'+(BW+2)+','+yb,cls:'fl-'+f.kind,'marker-end':'url(#mk'+f.kind+uid+')'}));
      const my=(ya+yb)/2;
      svg.appendChild(sv('circle',{cx:xl,cy:my,r:7,cls:'fl-bd-'+f.kind}));
      svg.appendChild(sv('text',{x:xl,y:my+3.5,cls:'fl-n',text:String(i+1)}));
      legend.appendChild(h('li',null,h('span',{cls:'nb',text:String(i+1)}),h('span',{cls:'kd'+(f.kind==='money'?'':' v'),text:f.kind==='money'?'お金':'モノ・サービス'}),'　'+P[f.a].label+' → '+P[f.b].label+'：'+f.text));
    });
    svg.setAttribute('width',avail); svg.setAttribute('height',Math.ceil(total)); svg.setAttribute('viewBox','0 0 '+avail+' '+Math.ceil(total));
  }
  host.appendChild(svg);
  if(legend) host.appendChild(legend);
}
function registerFlow(host,mf,mask){ flowHosts.push({host:host,mf:mf,mask:mask,w:0}); }
function drawAllFlows(force){
  flowHosts = flowHosts.filter(function(x){return document.body.contains(x.host);});
  flowHosts.forEach(function(x){

function quizAct(kind){
  if(!DECK) return;
  if(kind==='prev'){
    // たどった順（DECK.hist）を1つ戻す。「まだ」で山の最後へ回した社は、最後から抜いて先頭へ戻す
    if(!DECK.hist||!DECK.hist.length) return;
    const last=DECK.hist.pop();
    if(last.kind==='again'){ const i=DECK.queue.lastIndexOf(last.code); if(i>=0) DECK.queue.splice(i,1); }
    else DECK.done=Math.max(0,DECK.done-1);
    DECK.queue.unshift(last.code); S.c=last.code; pushHash(false);
    DECK.revealed=false; renderQuiz(); window.scrollTo(0,0); return;
  }
  if(!DECK.queue.length) return;
  const code=DECK.queue[0];
  if(kind==='known'||kind==='again'||kind==='next') (DECK.hist=DECK.hist||[]).push({code:code,kind:kind});
  if(kind==='reveal'){ DECK.revealed=true; renderQuiz(); return; }
  if(kind==='hide'){ DECK.revealed=false; renderQuiz(); return; }
  if(kind==='known'){ setRead(code,true); DECK.queue.shift(); DECK.done++; }
  else if(kind==='again'){ DECK.queue.shift(); DECK.queue.push(code); }
  else if(kind==='next'){ DECK.queue.shift(); DECK.done++; }
  if(DECK.queue.length){ S.c=DECK.queue[0]; pushHash(false); }
  DECK.revealed=false; renderQuiz(); window.scrollTo(0,0);
}

/* スマホ：暗記カードを左にスワイプで次へ、右にスワイプで前へ */
(function(){
  let sx=0, sy=0, st=0, ok=false;
  function inHScroll(el){
    // 横にスクロールできる部分（お金の流れ図など）の中で始まった操作はスワイプとして扱わない
    for(let n=el; n&&n.id!=='v-quiz'; n=n.parentElement){
      if(n.scrollWidth>n.clientWidth+2){ const ox=getComputedStyle(n).overflowX; if(ox==='auto'||ox==='scroll') return true; }
    }
    return false;
  }
  document.addEventListener('touchstart',function(e){
    ok=false;
    if(S.tab!=='quiz'||e.touches.length!==1) return;
    const t=e.target; if(!t.closest||!t.closest('#v-quiz')) return;
    if(t.closest('input,textarea,select')) return;
    const p=e.touches[0];
    if(p.clientX<24) return;  // 画面の左端はブラウザの「戻る」操作に譲る
    if(inHScroll(t)) return;
    sx=p.clientX; sy=p.clientY; st=Date.now(); ok=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!ok) return; ok=false;
    const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy;
    if(Date.now()-st>800||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5) return;
    quizAct(dx<0?'next':'prev');
  },{passive:true});
})();

    const a=h('a',{href:URL.createObjectURL(new Blob([json],{type:'application/json'})),download:'learn_progress_'+ymd+'.json'});
    document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
    flash('topMsg','書き出しました（クリップボードにコピー＋ファイル保存）');
  }catch(e){ flash('topMsg','ファイル保存に失敗。クリップボードのJSONを使ってください',true); }
}
function mergeProgress(o){
  if(!o||typeof o!=='object') throw new Error('形式が違います');
  let nr=0,nm=0;
  if(o.read&&typeof o.read==='object') for(const k in o.read){ const v=String(o.read[k]); if(!store.read[k]||v>store.read[k]){ if(store.read[k]!==v) nr++; store.read[k]=v; } }
  if(o.memo&&typeof o.memo==='object') for(const k in o.memo){ const v=String(o.memo[k]||''); if(!v) continue;
    const cur=store.memo[k]||''; if(!cur){store.memo[k]=v;nm++;} else if(cur!==v&&cur.indexOf(v)<0){ store.memo[k]=cur+'\n---\n'+v; nm++; } }
  if(o.settings&&typeof o.settings==='object') for(const k in o.settings){ if(!(k in store.settings)) store.settings[k]=o.settings[k]; }
  saveStore(); return '読了 '+nr+' 件・メモ '+nm+' 件を取り込みました';
}
function setupIO(){
  $('btnExport').addEventListener('click',exportProgress);
  $('btnImport').addEventListener('click',function(){ $('ioPanel').hidden=!$('ioPanel').hidden; });
  $('ioClose').addEventListener('click',function(){ $('ioPanel').hidden=true; });
  function run(text){
    try{ const msg=mergeProgress(JSON.parse(text)); flash('ioMsg',msg); VIEW=computeList(); renderAll(); }
    catch(e){ flash('ioMsg','取り込めません：'+(e&&e.message?e.message:'JSONを確認してください'),true); }
  }
  $('ioGo').addEventListener('click',function(){ const t=$('ioText').value.trim(); if(!t){flash('ioMsg','JSONを貼り付けるか、ファイルを選んでください',true);return;} run(t); });
  $('ioFile').addEventListener('change',function(){
    const f=$('ioFile').files&&$('ioFile').files[0]; if(!f) return;
    const r=new FileReader(); r.onload=function(){ run(String(r.result)); }; r.onerror=function(){ flash('ioMsg','ファイルを読めませんでした',true); }; r.readAsText(f);
  });
}

/* ===== 起動 ===== */
function init(){
  loadStore();
  S=defState();
  const urlHash=location.hash.replace(/^#/,'');
  S=fromHash(urlHash||store.settings.hash||'');
  // URLに指定がないときは、絞り込み・並べ替えだけ前回のまま残し、一覧の先頭から始める
  if(!urlHash){ S.tab='list'; S.c=''; }
  const sortSel=$('sort');
  SORTS.forEach(function(s){ sortSel.appendChild(h('option',{value:s[0],text:'並べ替え：'+s[1]})); });
  sortSel.addEventListener('change',function(){S.sort=sortSel.value;onFilter();});
  $('dir').addEventListener('click',function(){S.dir=S.dir==='desc'?'asc':'desc';syncControls();onFilter();});
  $('grp').addEventListener('change',function(){S.grp=$('grp').checked;onFilter();});
  let qt; $('q').addEventListener('input',function(){ S.q=$('q').value; clearTimeout(qt); qt=setTimeout(onFilter,150); });
  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click',function(){ setTab(t.getAttribute('data-tab')); }); });
  buildFilters(); setupIO();
  $('flt').open=window.innerWidth>=720;
  Promise.all([
    fetchJson('data/companies.json',false), fetchJson('data/finance.json',true), fetchJson('data/fin.json',true),
    fetchJson('data/profiles.json',true), fetchJson('data/documents.json',true), fetchJson('data/meta.json',true)
  ]).then(function(r){
    COMPANIES=Array.isArray(r[0])?r[0]:[]; FINA=r[1]||{}; FIN=r[2]||{}; PROF=r[3]||{}; META=r[5]||{};
    buildDocs(Array.isArray(r[4])?r[4]:[]);
    buildRows();
    $('sub').textContent='東証 情報・通信業＋IT関連の上場企業を、誰に・何を・どうやって売るか／お金の流れで覚える暗記ページ'+(META.updated?'｜データ更新 '+META.updated:'');
    syncControls(); VIEW=computeList(); renderAll();
  }).catch(function(e){
    $('sub').textContent='データを読み込めませんでした（'+(e&&e.message?e.message:'エラー')+'）。http で配信された環境で開いてください。';
    $('sub').className='sub err';
  });
  function onNav(){
    S=fromHash(location.hash.replace(/^#/,'')); syncControls(); VIEW=computeList(); renderAll();
  }
  window.addEventListener('popstate',onNav); window.addEventListener('hashchange',function(){ if(('#'+toHash())!==location.hash&&location.hash) onNav(); });
}
init();
</script>
